# NAD --- Connect VMs to Linux bridge 'br1' (backed by bond1) via cnv-bridge
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bond-br1-network
  namespace: vmtest
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "cnv-bridge",
      "name": "bond-br1-network",
      "bridge": "br1"
    }
