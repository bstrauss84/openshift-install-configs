apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: cluster
rendezvousIP: 10.90.0.21
# additionalNTPSources:
# - 10.90.0.2
hosts:
- hostname: cluster-master-1
  role: master
  interfaces:
  - name: eno1
    macAddress: 52:54:00:aa:11:01
  rootDeviceHints:
    deviceName: "/dev/disk/by-path/pci-0000:01:00.0-nvme-1"
  networkConfig:
    interfaces:
    - name: eno1
      type: ethernet
      state: up
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 10.90.0.21
          prefix-length: 24
      ipv6:
        enabled: false
    dns-resolver:
      config:
        server:
        - 10.90.0.3
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 10.90.0.1
        next-hop-interface: eno1
        table-id: 254

- hostname: cluster-master-2
  role: master
  interfaces:
  - name: eno1
    macAddress: 52:54:00:aa:12:01
  rootDeviceHints:
    deviceName: "/dev/disk/by-path/pci-0000:01:00.0-nvme-1"
  networkConfig:
    interfaces:
    - name: eno1
      type: ethernet
      state: up
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 10.90.0.22
          prefix-length: 24
      ipv6:
        enabled: false
    dns-resolver:
      config:
        server:
        - 10.90.0.3
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 10.90.0.1
        next-hop-interface: eno1
        table-id: 254
