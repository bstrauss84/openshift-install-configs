name: disconnected-sno-static-single-nic-novip
targetReleases: [ "4.18", "4.19", "4.20", "4.21", "4.22" ]
platform: none
method: agent
networking:
  type: OVNKubernetes
  machineNetworkCIDRs:
  - 10.90.0.0/24
loadBalancer: none
addressing: static
nodes:
  controlPlane: 1
  workers: 0
notes:
  - No VIPs for SNO; DNS for api/ingress should resolve directly to the node IP
  - Prefer imageDigestSources; imageContentSources is deprecated (kept as commented example)
artifacts:
  - install-config.yaml
  - agent-config.yaml

tokens: [ baremetal, agent, sno, disconnected, static ]
