name: connected-ha-extlb-dhcp-single-nic
targetReleases: [ "4.18", "4.19", "4.20", "4.21", "4.22" ]
platform: none
method: agent
networking:
  type: OVNKubernetes
  machineNetworkCIDRs:
  - 10.90.0.0/24
loadBalancer: external
addressing: dhcp
nodes:
  controlPlane: 3
  workers: 3
vips:
notes:
  - Prefer imageDigestSources; imageContentSources is deprecated (kept as commented example)
artifacts:
  - install-config.yaml
  - agent-config.yaml

tokens: [ baremetal, agent, ha, connected, extlb, dhcp ]
