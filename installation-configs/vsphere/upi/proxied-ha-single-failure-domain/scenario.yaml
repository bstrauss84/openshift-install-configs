name: proxied-ha-single-failure-domain
targetReleases: [ "4.18", "4.19", "4.20", "4.21", "4.22" ]
platform: vsphere
method: upi
networking:
  type: OVNKubernetes
  machineNetworkCIDRs:
  - 10.90.0.0/24
loadBalancer: external
addressing: dhcp
nodes:
  controlPlane: 3
  workers: 3
proxy:
  enabled: true
artifacts:
  - install-config.yaml

tokens: [ vsphere, upi, ha, proxied ]
