name: connected-ha-multi-failure-domain
targetReleases: [ "4.18", "4.19", "4.20", "4.21", "4.22" ]
platform: vsphere
method: upi
networking:
  type: OVNKubernetes
  machineNetworkCIDRs:
  - 10.90.0.0/24
loadBalancer: external
addressing: dhcp
nodes:
  controlPlane: 3
  workers: 3
failureDomains:
  - fd-a
  - fd-b
  - fd-c
notes:
  - UPI: platform none; create NLB/ALB and Route53-equivalent (DNS) yourself
  - Distribute nodes across three vSphere clusters/datastores for resilience
artifacts:
  - install-config.yaml

tokens: [ vsphere, upi, ha, connected ]
